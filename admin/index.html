<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Lunara — Gestione catalogo</title>
    <style>
      .lunara-sheets-link {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 10000;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 13px 18px;
        border: 1px solid rgba(80, 65, 48, .16);
        border-radius: 999px;
        background: #f4efe7;
        color: #40382f;
        box-shadow: 0 5px 22px rgba(40, 32, 24, .16);
        font: 600 14px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-decoration: none;
        transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
      }
      .lunara-sheets-link:hover {
        background: #fff;
        box-shadow: 0 8px 28px rgba(40, 32, 24, .2);
        transform: translateY(-2px);
      }
      .lunara-sheets-link:focus-visible {
        outline: 3px solid #9a8062;
        outline-offset: 3px;
      }
      .lunara-sheets-link svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }
      @media (max-width: 520px) {
        .lunara-sheets-link {
          right: 12px;
          bottom: 12px;
          padding: 12px 15px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <a
      class="lunara-sheets-link"
      href="https://script.google.com/macros/s/AKfycbxNCMnkMQ8ru0ZiXNXXa1tbgn83DFEjqH3slkea9s-8DQkKnbRZOis5NsIcsl0MKclF/exec"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Apri il gestionale Google Sheets Lunara in una nuova scheda"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="4" y="3" width="16" height="18" rx="2" stroke="currentColor" stroke-width="1.7"/>
        <path d="M8 8h8M8 12h8M8 16h3M13 16h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
      Gestionale Google Sheets
    </a>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
