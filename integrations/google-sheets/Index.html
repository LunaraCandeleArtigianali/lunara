<!doctype html><html lang="it"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lunara Gestionale</title><style>
:root{--ink:#29251f;--muted:#81786d;--line:#e9e1d6;--paper:#fbf8f3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Arial,sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:22px 4%;display:flex;justify-content:space-between;align-items:center}.brand{font:italic 34px Georgia,serif}.muted{color:var(--muted);font-size:13px}main{max-width:1400px;margin:auto;padding:28px 3%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font:40px Georgia,serif;font-weight:400;margin:5px 0 18px}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.btn,.tab{border:1px solid var(--line);border-radius:30px;padding:10px 16px;background:white;color:var(--ink);cursor:pointer;white-space:nowrap}.active,.primary{background:var(--ink);color:white}.panel{background:white;border:1px solid var(--line);border-radius:16px;overflow:hidden}.panelhead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}h2{font:26px Georgia,serif;font-weight:400;margin:0}.tablewrap{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee8df;vertical-align:top;white-space:pre-wrap;max-width:300px;overflow-wrap:anywhere}th{background:#faf7f2;position:sticky;top:0;color:var(--muted);font-size:11px;text-transform:uppercase}dialog{border:0;border-radius:18px;width:min(600px,94vw);padding:0}dialog::backdrop{background:#0008}.form{padding:22px;max-height:85vh;overflow:auto}.field{margin:12px 0;display:grid;gap:5px}.field label{font-size:12px;color:var(--muted)}textarea{font:inherit;padding:10px;border:1px solid var(--line);border-radius:9px;min-height:65px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.status{padding:12px 18px;color:var(--muted)}@media(max-width:600px){.top,.panelhead{align-items:flex-start;flex-direction:column}h1{font-size:34px}}</style></head><body><header><div><div class="brand">Lunara</div><div class="muted">Gestionale laboratorio</div></div><div class="muted" id="state">Connessione…</div></header><main><div class="top"><div><div class="muted">AMMINISTRAZIONE</div><h1>Gestione attività</h1><div class="muted" id="sheet"></div></div><button class="btn" onclick="refresh()">Aggiorna</button></div><nav class="tabs" id="tabs"></nav><section class="panel"><div class="panelhead"><div><h2 id="title">Caricamento</h2><div class="muted" id="info"></div></div><button class="btn primary" id="add" onclick="edit()">+ Nuovo inserimento</button></div><div class="tablewrap" id="table"></div><div class="status" id="status">Lettura dati…</div></section></main><dialog id="dlg"><form class="form" id="form"><h2 id="formtitle">Modifica</h2><div id="fields"></div><div class="actions"><button type="button" class="btn" onclick="dlg.close()">Annulla</button><button class="btn primary">Salva</button></div></form></dialog><script>
let dash,tab,data,rowEdit;const $=id=>document.getElementById(id);function api(fn,...a){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e.message||e)))[fn](...a))}
async function refresh(){try{dash=await api('getDashboard');$('sheet').textContent=dash.name;renderTabs();await load(tab||dash.tabs[0]?.name);$('state').textContent='Collegato'}catch(e){$('state').textContent='Errore';$('status').textContent=e.message}}
function renderTabs(){$('tabs').innerHTML=dash.tabs.map(t=>'<button class="tab '+(t.name===tab?'active':'')+'" onclick="load(&quot;'+t.name+'&quot;)">'+esc(t.name)+'</button>').join('')}
async function load(n){if(!n)return;tab=n;renderTabs();$('status').textContent='Caricamento…';try{data=await api('getTabData',n);$('title').textContent=n;$('info').textContent=data.rows.length+' righe'+(data.editable?' · modificabile':' · sola lettura');$('add').hidden=!data.editable;draw()}catch(e){$('status').textContent=e.message}}
function draw(){$('table').innerHTML=data.rows.length?'<table><thead><tr>'+data.headers.map(c=>'<th>'+esc(c.name)+(c.editable?'':' · formula')+'</th>').join('')+(data.editable?'<th></th>':'')+'</tr></thead><tbody>'+data.rows.map(r=>'<tr>'+data.headers.map((c,i)=>'<td>'+esc(r.values[i]||'')+'</td>').join('')+(data.editable?'<td><button class="btn" onclick="edit('+r.rowNumber+')">Modifica</button></td>':'')+'</tr>').join('')+'</tbody></table>':'<div class="status">Nessun dato</div>';$('status').textContent='Mostrate fino a 250 righe. Le colonne con formule sono protette.'}
function edit(r){rowEdit=r||null;const item=r?data.rows.find(x=>x.rowNumber===r):null;$('formtitle').textContent=item?'Modifica riga '+r:'Nuovo inserimento';$('fields').innerHTML=data.headers.filter(c=>c.editable).map(c=>'<div class="field"><label>'+esc(c.name)+'</label><textarea name="'+esc(c.name)+'">'+esc(item?item.values[c.index]||'':'')+'</textarea></div>').join('');$('dlg').showModal()}
$('form').addEventListener('submit',async e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));try{$('state').textContent='Salvataggio…';if(rowEdit)await api('updateRow',tab,rowEdit,values);else await api('addRow',tab,values);$('dlg').close();await load(tab);$('state').textContent='Salvato'}catch(err){alert(err.message);$('state').textContent='Errore'}});function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}refresh();setInterval(()=>{if(tab&&!$('dlg').open)load(tab)},30000);
</script></body></html>
